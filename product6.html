<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project 06 | Masha Mkrtchyan Interior Design</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header" data-header>
      <a class="brand" href="index.html" aria-label="Masha Mkrtchyan home">
        <span class="brand-mark">MK</span>
        <span>MASHA MKRTCHYAN</span>
      </a>

      <button class="menu-toggle" type="button" data-menu-toggle aria-label="Open menu">
        <span></span>
        <span></span>
      </button>

      <nav class="site-nav" data-nav>
        <a href="index.html">Home</a>
        <a class="is-active" href="portfolio.html" aria-current="page">Portfolio</a>
        <a href="service.html">Services</a>
        <a href="contact.html">Contact Us</a>
      </nav>
    </header>

    <main class="project-page">
      <div class="project-toolbar">
        <a class="project-back" href="portfolio.html">Back to portfolio</a>
      </div>

      <section class="project-gallery project-gallery-square" aria-label="Project image gallery">
        <button class="project-arrow project-arrow-left" type="button" data-detail-prev aria-label="Previous image"></button>

        <figure class="project-main">
          <img src="assets/optimized/t1.jpg" alt="Kids bedroom with football wall art and blue storage details" data-detail-main />
        </figure>

        <button class="project-arrow project-arrow-right" type="button" data-detail-next aria-label="Next image"></button>

        <div class="project-thumbs" data-detail-thumbs aria-label="Project thumbnails">
          <button class="project-thumb-arrow project-thumb-arrow-up" type="button" data-detail-prev aria-label="Previous thumbnail"></button>
          <button class="is-active" type="button" data-detail-thumb="0" data-detail-alt="Kids bedroom with football wall art and blue storage details" aria-label="Show project image 1">
            <img src="assets/optimized/t1.jpg" alt="" loading="lazy" decoding="async" />
          </button>
          <button type="button" data-detail-thumb="1" data-detail-alt="Kids bedroom with mirrored wardrobe and sports wall graphic" aria-label="Show project image 2">
            <img src="assets/optimized/t2.jpg" alt="" loading="lazy" decoding="async" />
          </button>
          <button type="button" data-detail-thumb="2" data-detail-alt="Bright kids bedroom with soft blue accents and round lighting" aria-label="Show project image 3">
            <img src="assets/optimized/t3.jpg" alt="" loading="lazy" decoding="async" />
          </button>
          <button type="button" data-detail-thumb="3" data-detail-alt="Kids bedroom storage design with rounded blue panels" aria-label="Show project image 4">
            <img src="assets/optimized/t4.jpg" alt="" loading="lazy" decoding="async" />
          </button>
          <button type="button" data-detail-thumb="4" data-detail-alt="Football themed bedroom with soft gray bed and blue accents" aria-label="Show project image 5">
            <img src="assets/optimized/t5.jpg" alt="" loading="lazy" decoding="async" />
          </button>
          <button class="project-thumb-arrow project-thumb-arrow-down" type="button" data-detail-next aria-label="Next thumbnail"></button>
        </div>
      </section>
    </main>

    <footer class="site-footer footer-panel portfolio-footer">
      <div class="section-inner footer-grid">
        <div class="footer-contact">
          <div class="footer-contact-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M21.944 3.054a1.5 1.5 0 0 0-1.537-.212L2.604 10.03a1.5 1.5 0 0 0 .09 2.79l4.306 1.434 1.67 5.01a1 1 0 0 0 1.72.338l2.38-2.694 4.64 3.412a1.5 1.5 0 0 0 2.344-1.01l2-14.5a1.5 1.5 0 0 0-.81-1.756zM10 17.5l-1.2-3.6 8.3-7.4-7.1 8.4z"/>
            </svg>
            <span>+374 96 080879</span>
          </div>
          <div class="footer-contact-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2C6.477 2 2 6.477 2 12c0 1.89.525 3.66 1.438 5.168L2 22l4.977-1.418A9.955 9.955 0 0 0 12 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm4.93 13.57c-.2.56-1.18 1.1-1.62 1.16-.44.07-.86.1-2.77-.58-2.33-.83-3.83-3.2-3.94-3.35-.12-.14-.96-1.28-.96-2.44s.6-1.73.82-1.97c.22-.24.48-.3.64-.3h.46c.15 0 .35-.06.55.42.2.48.68 1.66.74 1.78.06.12.1.26.02.42-.08.16-.12.26-.24.4-.12.14-.25.31-.36.42-.12.12-.24.25-.1.49.14.24.62.99 1.33 1.6.91.8 1.68 1.05 1.92 1.17.24.12.38.1.52-.06.14-.16.6-.7.76-.94.16-.24.32-.2.54-.12.22.08 1.4.66 1.64.78.24.12.4.18.46.28.06.1.06.56-.14 1.12z"/>
            </svg>
            <span>+374 96 080879</span>
          </div>
        </div>

        <div class="footer-info">
          <p class="footer-name">Masha Mkrtchyan</p>
          <p class="footer-socials">@_mk_interior_design<br />@masha.mkrtchyan._</p>
        </div>
      </div>

      <p class="footer-credit">site by codeflow</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
